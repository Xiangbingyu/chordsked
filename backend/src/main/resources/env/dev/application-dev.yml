server:
  port: 8081

spring:
  kafka:
    bootstrap-servers: ${CHORDSKED_KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    producer:
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
    consumer:
      enable-auto-commit: false
      auto-offset-reset: latest
  sql:
    init:
      schema-locations: ${CHORDSKED_SQL_SCHEMA:classpath:db/h2/schema.sql}
  datasource:
    url: ${CHORDSKED_DB_URL:jdbc:h2:mem:chordsked;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false}
    driver-class-name: ${CHORDSKED_DB_DRIVER:org.h2.Driver}
    username: ${CHORDSKED_DB_USERNAME:sa}
    password: ${CHORDSKED_DB_PASSWORD:}
  data:
    redis:
      host: ${CHORDSKED_REDIS_HOST:127.0.0.1}
      port: ${CHORDSKED_REDIS_PORT:6380}
      password: ${CHORDSKED_REDIS_PASSWORD:}
      database: ${CHORDSKED_REDIS_DB:0}
      timeout: ${CHORDSKED_REDIS_TIMEOUT:3s}
