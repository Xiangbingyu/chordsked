logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [requestId=%X{requestId}] - %msg%n"

spring:
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:db/h2/schema.sql
      data-locations: classpath:db/h2/data.sql

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.chordsked.backend.model.entity
  configuration:
    map-underscore-to-camel-case: true

chordsked:
  student:
    max-page-size: 100
    default-page-size: 20
  security:
    jwt:
      secret: ${CHORDSKED_JWT_SECRET:chordsked-jwt-secret-2026-001-dev-secure-key}
      issuer: ${CHORDSKED_JWT_ISSUER:chordsked-backend}
      access-expiration-seconds: ${CHORDSKED_JWT_ACCESS_EXPIRATION_SECONDS:7200}
      refresh-expiration-seconds: ${CHORDSKED_JWT_REFRESH_EXPIRATION_SECONDS:1209600}
    redis:
      enabled: ${CHORDSKED_SECURITY_REDIS_ENABLED:true}
      authority-cache-ttl-seconds: ${CHORDSKED_SECURITY_AUTHORITY_CACHE_TTL_SECONDS:300}
      token-session-enabled: ${CHORDSKED_SECURITY_TOKEN_SESSION_ENABLED:true}
