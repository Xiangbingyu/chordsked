spring:
  application:
    name: chordsked-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
      config:
        enabled: ${NACOS_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        import-check:
          enabled: false
    gateway:
      routes:
        - id: auth-service
          uri: lb://chordsked-auth
          predicates:
            - Path=/admin/api/v1/auth/**,/teachers/api/v1/auth/**,/students/api/v1/auth/**
        - id: admin-service
          uri: lb://chordsked-admin
          predicates:
            - Path=/admin/api/v1/**
        - id: teacher-service
          uri: lb://chordsked-teacher
          predicates:
            - Path=/teachers/api/v1/**
        - id: student-service
          uri: lb://chordsked-student
          predicates:
            - Path=/students/api/v1/**
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 5s

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    level: "%5p [${spring.application.name:unknown},%X{traceId:-}]"